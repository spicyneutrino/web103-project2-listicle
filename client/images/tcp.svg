<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img">
  <title>TCP three-way handshake between client and server</title>
  <rect width="300" height="150" fill="#eef2ff"/>
  <rect x="20" y="20" width="70" height="40" rx="6" fill="#4a63e7"/>
  <text x="55" y="45" font-size="12" fill="#fff" text-anchor="middle">Client</text>
  <rect x="210" y="20" width="70" height="40" rx="6" fill="#333"/>
  <text x="245" y="45" font-size="12" fill="#fff" text-anchor="middle">Server</text>
  <line x1="90" y1="55" x2="210" y2="85" stroke="#333" stroke-width="2" marker-end="url(#b)"/>
  <text x="150" y="65" font-size="11" text-anchor="middle">SYN</text>
  <line x1="210" y1="95" x2="90" y2="110" stroke="#4a63e7" stroke-width="2" marker-end="url(#c)"/>
  <text x="150" y="100" font-size="11" text-anchor="middle">SYN-ACK</text>
  <line x1="90" y1="120" x2="210" y2="130" stroke="#333" stroke-width="2" marker-end="url(#b)"/>
  <text x="150" y="140" font-size="11" text-anchor="middle">ACK</text>
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
    <marker id="c" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a63e7"/></marker>
  </defs>
</svg>
