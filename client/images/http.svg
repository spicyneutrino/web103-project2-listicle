<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img">
  <title>Browser sending a request to a server over HTTP</title>
  <rect width="300" height="150" fill="#eef2ff"/>
  <rect x="20" y="45" width="80" height="60" rx="6" fill="#4a63e7"/>
  <text x="60" y="80" font-size="14" fill="#fff" text-anchor="middle">Browser</text>
  <rect x="200" y="45" width="80" height="60" rx="6" fill="#333"/>
  <text x="240" y="80" font-size="14" fill="#fff" text-anchor="middle">Server</text>
  <line x1="100" y1="60" x2="200" y2="60" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="200" y1="90" x2="100" y2="90" stroke="#4a63e7" stroke-width="3" marker-end="url(#arrow2)"/>
  <text x="150" y="50" font-size="12" text-anchor="middle">GET</text>
  <text x="150" y="112" font-size="12" text-anchor="middle">200 OK</text>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a63e7"/></marker>
  </defs>
</svg>
