<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img">
  <title>Domain name being looked up via DNS and resolved to an IP address</title>
  <rect width="300" height="150" fill="#eef2ff"/>
  <rect x="10" y="60" width="80" height="40" rx="6" fill="#4a63e7"/>
  <text x="50" y="85" font-size="12" fill="#fff" text-anchor="middle">example.com</text>
  <circle cx="150" cy="80" r="30" fill="#333"/>
  <text x="150" y="85" font-size="12" fill="#fff" text-anchor="middle">DNS</text>
  <rect x="210" y="60" width="80" height="40" rx="6" fill="#2e7d32"/>
  <text x="250" y="85" font-size="12" fill="#fff" text-anchor="middle">93.184.x.x</text>
  <line x1="90" y1="80" x2="120" y2="80" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <line x1="180" y1="80" x2="210" y2="80" stroke="#333" stroke-width="3" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
  </defs>
</svg>
