<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img">
  <title>Router assigning network settings to a laptop via DHCP</title>
  <rect width="300" height="150" fill="#eef2ff"/>
  <rect x="20" y="55" width="70" height="40" rx="6" fill="#333"/>
  <text x="55" y="80" font-size="12" fill="#fff" text-anchor="middle">Router</text>
  <rect x="210" y="55" width="70" height="40" rx="6" fill="#4a63e7"/>
  <text x="245" y="80" font-size="12" fill="#fff" text-anchor="middle">Laptop</text>
  <line x1="90" y1="65" x2="210" y2="65" stroke="#333" stroke-width="2" marker-end="url(#e)"/>
  <text x="150" y="55" font-size="11" text-anchor="middle">Offer</text>
  <line x1="210" y1="90" x2="90" y2="90" stroke="#4a63e7" stroke-width="2" marker-end="url(#f)"/>
  <text x="150" y="112" font-size="11" text-anchor="middle">IP: 192.168.1.42</text>
  <defs>
    <marker id="e" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#333"/></marker>
    <marker id="f" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4a63e7"/></marker>
  </defs>
</svg>
